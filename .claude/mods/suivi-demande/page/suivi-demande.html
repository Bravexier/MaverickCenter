<title>Suivi de la demande</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Une colonne de lecture, du résumé au détail : but, étapes, temps, sous-tâches, agents, GitHub, site de dev. */
:root {
  --fond: #f3f5f8;
  --surface: #ffffff;
  --trait: #d9dee7;
  --texte: #1b2330;
  --discret: #5d6878;
  --accent: #2f5fd0;
  --accent-doux: #e3eafb;
  --bon: #1d7f55;
  --bon-doux: #dff3e9;
  --attente: #a26200;
  --attente-doux: #fbeccd;
  --alerte: #b93a32;
  --alerte-doux: #fbe2df;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #12161d; --surface: #1a2029; --trait: #2c3543; --texte: #e6eaf0; --discret: #97a3b4;
    --accent: #7ea2ff; --accent-doux: #212d4a; --bon: #58c796; --bon-doux: #173327;
    --attente: #e8b04f; --attente-doux: #3a2d12; --alerte: #f08379; --alerte-doux: #3d1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #12161d; --surface: #1a2029; --trait: #2c3543; --texte: #e6eaf0; --discret: #97a3b4;
  --accent: #7ea2ff; --accent-doux: #212d4a; --bon: #58c796; --bon-doux: #173327;
  --attente: #e8b04f; --attente-doux: #3a2d12; --alerte: #f08379; --alerte-doux: #3d1d1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--fond); color: var(--texte); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
.page {
  max-width: 860px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
.fraicheur { font-family: var(--mono); font-size: 12px; color: var(--discret); }
h2 { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--discret); margin: 0 0 8px; }
section { min-width: 0; }
.but { font-size: 20px; font-weight: 500; line-height: 1.3; margin: 0; text-wrap: balance; }
.attend {
  margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--attente-doux); color: var(--attente);
  font-weight: 500; display: flex; gap: 10px; align-items: flex-start;
}
.attend .point { margin-top: 6px; }

/* Étapes */
.etapes { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.etapes li {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--trait); color: var(--discret); font-size: 13px; background: transparent;
}
.etapes li.faite { color: var(--bon); border-color: transparent; background: var(--bon-doux); }
.etapes li.courante { color: var(--accent); border-color: var(--accent); background: var(--accent-doux); font-weight: 600; }

/* Chiffres */
.chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--trait); border: 1px solid var(--trait); border-radius: 10px; overflow: hidden; }
.chiffre { background: var(--surface); padding: 10px 12px; min-width: 0; }
.chiffre dt { font-size: 12px; color: var(--discret); }
.chiffre dd { margin: 2px 0 0; font-family: var(--mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chiffre small { display: block; font-family: var(--sans); font-size: 12px; color: var(--discret); font-weight: 400; }
dl { margin: 0; }
.jauge { height: 6px; border-radius: 3px; background: var(--trait); overflow: hidden; margin-top: 8px; }
.jauge i { display: block; height: 100%; background: var(--bon); border-radius: 3px; transition: width .4s ease; }

/* Listes */
.liste { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; }
.liste > li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-top: 1px solid var(--trait); min-width: 0; }
.liste > li:first-child { border-top: 0; }
.liste .corps { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.liste .detail { display: block; font-size: 13px; color: var(--discret); }
.liste .cote { font-family: var(--mono); font-size: 12px; color: var(--discret); white-space: nowrap; padding-top: 2px; font-variant-numeric: tabular-nums; }
li.faite .titre { color: var(--discret); text-decoration: line-through; text-decoration-color: var(--trait); }
li.finie { opacity: .62; }
.titre { font-weight: 500; }
.etat { font-size: 12px; font-weight: 600; }
.etat.marche { color: var(--accent); }
.etat.pause { color: var(--attente); }
.etat.bon { color: var(--bon); }
.etat.mal { color: var(--alerte); }

/* Voyants : la forme dit l'état, la couleur le confirme. */
.voyant { flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; line-height: 1; }
.voyant.marche { border: 2px solid var(--accent-doux); border-top-color: var(--accent); animation: tourne .9s linear infinite; }
.voyant.file { border: 2px dotted var(--discret); }
.voyant.pause { background: var(--attente-doux); color: var(--attente); animation: bat 1.8s ease-in-out infinite; }
.voyant.bon { background: var(--bon-doux); color: var(--bon); }
.voyant.mal { background: var(--alerte-doux); color: var(--alerte); }
.voyant.libre { border: 2px solid var(--trait); }
.point { flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: bat 1.4s ease-in-out infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
@keyframes bat { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .voyant, .point { animation: none !important; } .jauge i { transition: none; } }

.deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.vide { background: var(--surface); border: 1px dashed var(--trait); border-radius: 10px; padding: 22px 16px; color: var(--discret); }
.vide strong { display: block; color: var(--texte); font-weight: 600; margin-bottom: 4px; }
.mono { font-family: var(--mono); font-size: 13px; }
</style>

<main class="page">
  <header>
    <h1>Suivi de la demande</h1>
    <span class="fraicheur" id="fraicheur">En attente des premières données…</span>
  </header>
  <div class="vide" id="vide">
    <strong>Aucune demande suivie pour l'instant</strong>
    Dès votre prochaine demande, cette page affiche son but, ses sous-tâches, le temps passé, les agents au travail, l'avancement sur GitHub et l'installation sur le site de dev.
  </div>
  <div id="corps" hidden style="display:flex;flex-direction:column;gap:18px"></div>
</main>

<script>
(() => {
  const PHASES = [
    ['analyse', 'Analyse'], ['developpement', 'Développement'], ['verification', 'Vérification'],
    ['publication', 'Publication'], ['ci', 'CI'], ['fusion', 'Fusion'], ['installation', 'Installation'],
  ]
  const EN_VIE = ['pending', 'running', 'waiting', 'idle']
  const corps = document.getElementById('corps')
  const vide = document.getElementById('vide')
  const fraicheur = document.getElementById('fraicheur')
  let etat = null
  let recu = false

  const el = (balise, attributs, ...enfants) => {
    const noeud = document.createElement(balise)
    for (const [cle, valeur] of Object.entries(attributs || {})) {
      if (valeur === undefined || valeur === false) continue
      if (cle === 'class') noeud.className = valeur
      else if (cle.startsWith('data-')) noeud.setAttribute(cle, String(valeur))
      else noeud[cle] = valeur
    }
    for (const enfant of enfants.flat()) {
      if (enfant === null || enfant === undefined || enfant === false) continue
      noeud.append(enfant instanceof Node ? enfant : document.createTextNode(String(enfant)))
    }
    return noeud
  }
  const nombre = v => (typeof v === 'number' && Number.isFinite(v) ? v : undefined)
  const duree = minutes => {
    const m = Math.max(0, Math.round(minutes))
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`
  }
  const voyant = (genre, signe) => el('span', { class: `voyant ${genre}`, ariaHidden: 'true' }, signe || '')
  const section = (titre, ...enfants) => el('section', {}, el('h2', {}, titre), ...enfants)

  // Les durées vivantes : le texte seul est rafraîchi, les animations ne repartent pas.
  const vivant = (mode, base, depuis) => el('span', { 'data-mode': mode, 'data-base': base ?? 0, 'data-depuis': depuis ?? '' })
  const rafraichirLesDurees = () => {
    const maintenant = Date.now()
    for (const noeud of document.querySelectorAll('[data-mode]')) {
      const base = Number(noeud.dataset.base) || 0
      const depuis = noeud.dataset.depuis === '' ? undefined : Number(noeud.dataset.depuis)
      const ecoule = base + (depuis === undefined ? 0 : Math.max(0, maintenant - depuis))
      noeud.textContent = duree(ecoule / 60000)
    }
    if (etat && nombre(etat.majLe) !== undefined) {
      const s = Math.max(0, Math.round((maintenant - etat.majLe) / 1000))
      fraicheur.textContent = s < 60 ? `Mis à jour il y a ${s} s` : `Mis à jour il y a ${duree(s / 60)}`
    }
  }

  const reste = demande => {
    if (nombre(demande.resteMinutes) !== undefined) return demande.resteMinutes
    const ouvertes = (demande.sousTaches || []).filter(u => u.etat !== 'faite')
    if (!ouvertes.some(u => nombre(u.minutes) !== undefined)) return undefined
    return ouvertes.reduce((somme, u) => somme + (nombre(u.minutes) || 0), 0)
  }

  const blocAgents = (agents, principal, demande) => {
    const enVie = agents.filter(a => EN_VIE.includes(a.statut))
    const finis = agents.filter(a => !EN_VIE.includes(a.statut)).slice(-6)
    const profondeur = a => {
      const parent = agents.find(autre => autre.id === a.parentId)
      return parent ? 1 + profondeur(parent) : 0
    }
    const ligne = a => {
      const vue = {
        running: ['marche', '', 'marche', 'en marche'],
        pending: ['file', '', '', 'en file'],
        waiting: ['pause', 'Ⅱ', 'pause', 'attend ses agents ou un accord'],
        idle: ['pause', 'Ⅱ', 'pause', 'attend une instruction'],
        completed: ['bon', '✓', 'bon', 'terminé'],
        failed: ['mal', '×', 'mal', 'en échec'],
        killed: ['mal', '×', 'mal', 'arrêté'],
      }[a.statut] || ['libre', '', '', String(a.statut)]
      const enCours = EN_VIE.includes(a.statut)
      const li = el('li', { class: enCours ? '' : 'finie' },
        voyant(vue[0], vue[1]),
        el('span', { class: 'corps' },
          el('span', { class: 'titre' }, a.type), ' ',
          el('span', { class: `etat ${vue[2]}` }, '· ', vue[3]),
          el('span', { class: 'detail' }, a.description)),
        enCours && nombre(a.debut) !== undefined ? el('span', { class: 'cote' }, vivant('depuis', 0, a.debut)) : null)
      li.style.paddingLeft = `${12 + 26 * (1 + profondeur(a))}px`
      return li
    }
    let tete
    if (principal.attendReponse || (demande && demande.attente)) tete = ['pause', 'Ⅱ', 'pause', 'attend votre réponse']
    else if (principal.estActif) tete = ['marche', '', 'marche', 'en marche']
    else if (enVie.some(a => a.statut === 'running' || a.statut === 'pending')) tete = ['pause', 'Ⅱ', 'pause', 'attend ses agents']
    else tete = ['pause', 'Ⅱ', 'pause', 'attend votre message']
    return section('Agents', el('ul', { class: 'liste' },
      el('li', {},
        voyant(tete[0], tete[1]),
        el('span', { class: 'corps' },
          el('span', { class: 'titre' }, 'Session principale'), ' ',
          el('span', { class: `etat ${tete[2]}` }, '· ', tete[3]),
          el('span', { class: 'detail' }, enVie.length === 0 ? 'Aucun agent lancé en ce moment' : `${enVie.length} agent${enVie.length > 1 ? 's' : ''} en vie`))),
      enVie.map(ligne), finis.map(ligne)))
  }

  const dessiner = () => {
    const demande = etat && etat.demande
    const agents = (etat && Array.isArray(etat.agents) ? etat.agents : [])
    const principal = (etat && etat.principal) || {}
    corps.replaceChildren()
    if (!demande) {
      vide.hidden = false
      corps.hidden = agents.length === 0
      if (agents.length > 0) corps.append(blocAgents(agents, principal, null))
      if (recu && !etat) fraicheur.textContent = 'Aucune donnée reçue'
      rafraichirLesDurees()
      return
    }
    vide.hidden = true
    corps.hidden = false

    const taches = Array.isArray(demande.sousTaches) ? demande.sousTaches : []
    const faites = taches.filter(u => u.etat === 'faite').length
    const rang = PHASES.findIndex(([cle]) => cle === demande.phase)
    const aFaire = reste(demande)

    corps.append(
      el('section', {},
        el('h2', {}, 'But'),
        el('p', { class: 'but' }, demande.but),
        demande.attente ? el('div', { class: 'attend' }, el('span', { class: 'point' }), el('span', {}, 'Attend de vous : ', demande.attente)) : null),

      section('Étapes', el('ol', { class: 'etapes' }, PHASES.map(([, libelle], i) =>
        el('li', { class: i < rang ? 'faite' : i === rang ? 'courante' : '' },
          i < rang ? '✓ ' : null, i === rang ? el('span', { class: 'point' }) : null, libelle)))),

      section('Temps', el('dl', { class: 'chiffres' },
        el('div', { class: 'chiffre' }, el('dt', {}, 'Temps de travail'),
          el('dd', {}, vivant('travail', nombre(demande.travailMs) || 0, principal.estActif ? nombre(principal.debutTour) : undefined),
            el('small', {}, 'mesuré'))),
        el('div', { class: 'chiffre' }, el('dt', {}, 'Reste à faire'),
          el('dd', {}, aFaire === undefined ? '—' : `≈ ${duree(aFaire)}`, el('small', {}, aFaire === undefined ? 'non estimé' : 'estimé'))),
        el('div', { class: 'chiffre' }, el('dt', {}, 'Commencée il y a'),
          el('dd', {}, vivant('depuis', 0, nombre(demande.debut)),
            el('small', {}, `${demande.messages || 1} tour${(demande.messages || 1) > 1 ? 's' : ''} de travail`))),
        el('div', { class: 'chiffre' }, el('dt', {}, 'Sous-tâches faites'),
          el('dd', {}, `${faites}/${taches.length}`,
            (() => { const j = el('div', { class: 'jauge' }, el('i', {})); j.firstChild.style.width = `${taches.length ? (100 * faites) / taches.length : 0}%`; return j })())))),

      taches.length > 0 ? section('Sous-tâches', el('ul', { class: 'liste' }, taches.map(u => {
        const vue = {
          faite: ['bon', '✓', 'bon', 'faite'], en_cours: ['marche', '', 'marche', 'en cours'],
          programmee: ['libre', '', '', 'programmée'], en_attente: ['pause', 'Ⅱ', 'pause', 'en attente'],
        }[u.etat] || ['libre', '', '', '']
        return el('li', { class: u.etat === 'faite' ? 'faite' : '' },
          voyant(vue[0], vue[1]),
          el('span', { class: 'corps' }, el('span', { class: 'titre' }, u.titre),
            el('span', { class: 'detail' }, el('span', { class: `etat ${vue[2]}` }, vue[3]), u.agent ? ` · ${u.agent}` : '')),
          nombre(u.minutes) !== undefined ? el('span', { class: 'cote' }, duree(u.minutes)) : null)
      }))) : null,

      blocAgents(agents, principal, demande),

      el('div', { class: 'deux' },
        section('GitHub', el('ul', { class: 'liste' },
          el('li', {}, voyant(demande.branche ? 'bon' : 'libre', demande.branche ? '✓' : ''),
            el('span', { class: 'corps' }, el('span', { class: 'titre' }, 'Branche'),
              el('span', { class: 'detail mono' }, demande.branche || 'pas encore créée'))),
          el('li', {}, voyant(nombre(demande.pr) !== undefined ? 'bon' : 'libre', nombre(demande.pr) !== undefined ? '✓' : ''),
            el('span', { class: 'corps' }, el('span', { class: 'titre' }, 'Pull request'),
              el('span', { class: 'detail' }, nombre(demande.pr) !== undefined ? `PR #${demande.pr}${rang >= 6 ? ' · fusionnée' : ''}` : 'pas encore ouverte'))),
          (() => {
            const vue = { en_cours: ['marche', '', 'marche', 'en cours'], verte: ['bon', '✓', 'bon', 'verte'], rouge: ['mal', '×', 'mal', 'rouge'] }[demande.ci] || ['libre', '', '', 'pas encore lancée']
            return el('li', {}, voyant(vue[0], vue[1]),
              el('span', { class: 'corps' }, el('span', { class: 'titre' }, 'CI'), el('span', { class: `detail etat ${vue[2]}` }, vue[3])))
          })())),
        section('Site de dev', el('ul', { class: 'liste' },
          el('li', {}, voyant(demande.phase === 'installation' ? 'marche' : 'libre', ''),
            el('span', { class: 'corps' }, el('span', { class: 'titre' }, 'Installation'),
              el('span', { class: 'detail' }, demande.phase === 'installation'
                ? 'en cours : cette page sera supprimée dès que la nouvelle version sera servie'
                : 'rien à installer tant que la PR n’est pas fusionnée'))),
          demande.versionSite ? el('li', {}, voyant('libre', ''),
            el('span', { class: 'corps' }, el('span', { class: 'titre' }, 'Version servie'),
              el('span', { class: 'detail mono' }, `V${demande.versionSite}`))) : null))))
    rafraichirLesDurees()
  }

  const demarrer = async () => {
    const attente = setTimeout(() => { if (!recu) fraicheur.textContent = 'Données indisponibles pour l’instant' }, 10000)
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null
    if (!db) { clearTimeout(attente); fraicheur.textContent = 'Connectez-vous pour voir le suivi'; return }
    db.doc('suivi/etat').onSnapshot(
      instantane => { clearTimeout(attente); recu = true; etat = instantane.exists ? instantane.data() : null; dessiner() },
      () => { clearTimeout(attente); fraicheur.textContent = 'Lecture du suivi refusée ou interrompue' },
    )
  }
  dessiner()
  setInterval(rafraichirLesDurees, 1000)
  demarrer()
})()
</script>
