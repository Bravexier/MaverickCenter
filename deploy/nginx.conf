# Maverick Center — site statique servi par nginx.
# Monté dans le conteneur comme /etc/nginx/conf.d/default.conf (voir docker-compose.yml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives : fonctionne derrière un proxy inversé ou sur un autre port.
    absolute_redirect off;

    # Contenu qui appartient à un tiers : accès protégé par mot de passe, pas d'indexation.
    # (Pour désactiver le mot de passe : retirer les deux lignes auth_basic ET le volume .htpasswd du compose.)
    auth_basic "Maverick Center";
    auth_basic_user_file /etc/nginx/.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fichiers générés dont le nom change à chaque version : cache long.
    location /_astro/ {
        expires 1y;
    }
}
