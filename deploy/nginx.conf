# Maverick Center — le site (fichiers statiques) et son service des personnages (/api/), servis par nginx.
# Monté dans le conteneur comme /etc/nginx/conf.d/default.conf (voir docker-compose.yml). Même fichier pour le NAS et pour les installateurs.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives : fonctionne derrière un proxy inversé ou sur un autre port.
    absolute_redirect off;

    # Contenu qui appartient à un tiers : accès protégé par mot de passe, pas d'indexation.
    # (Pour désactiver le mot de passe : retirer les deux lignes auth_basic ET le volume .htpasswd du compose.)
    auth_basic "Maverick Center";
    auth_basic_user_file /etc/nginx/.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    # same-origin : le navigateur ne donne l'adresse de la page qu'au site lui-même (jamais à un site tiers : liens vers les Google Docs, Fandom…) ;
    # le service en tire la page d'où vient chaque appel /api/ (métriques, docs/serveur.md, « Métriques et volume »), sans sa chaîne de requête.
    # Même valeur que le Caddyfile du VPS (deploy/vps/Caddyfile), qui la réécrit.
    add_header Referrer-Policy "same-origin" always;
    # Aucune page du site n'est faite pour être affichée dans le cadre d'un autre site (clickjacking) ni n'utilise ces capteurs.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Politique de contenu minimale : sans toucher aux scripts et styles en ligne du site, elle ferme le cadrage par un autre site, les <base> et <object> injectés
    # et l'envoi d'un formulaire vers un autre site.
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    location / {
        # Les pages changent à chaque publication ; revalidation automatique, sans vider le cache navigateur.
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Fichiers générés dont le nom change à chaque version : cache long.
    location /_astro/ {
        expires 1y;
    }

    # Service des personnages (conteneur « serveur » de docker-compose.yml, docs/serveur.md), derrière le même mot de passe que le site.
    # L'adresse du service est résolue à chaque requête (DNS de Docker) : nginx démarre sans lui et le retrouve quand il redémarre ;
    # s'il est arrêté, /api/ répond une erreur en quelques secondes (502 ou 504) et les pages de lecture restent servies.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $service http://serveur:8787;
        proxy_pass $service;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        client_max_body_size 1m;
    }

    # Code du service, livré avec le site (site/_serveur/) : exécuté par le conteneur « serveur », jamais servi.
    location ^~ /_serveur/ {
        return 404;
    }
}
