# Lancement : docker compose up -d   puis   http://IP-DU-NAS:8080
# Prérequis : créer .htpasswd (voir README.md), sinon nginx refuse de démarrer.
# Deux conteneurs : nginx sert le site (site/) et transmet /api/ au service des personnages, qui écrit dans sa base vivante (db/).
services:
  maverick-center:
    image: nginx:1.27-alpine
    container_name: maverick-center
    restart: unless-stopped
    ports:
      - "8080:80"          # changer 8080 si le port est déjà pris sur le NAS
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro

  # Service des personnages (docs/serveur.md) : son code arrive avec le site (site/_serveur/, mis à jour par update-site.sh) et il se relance
  # seul quand une nouvelle version est livrée. Aucun port publié : seul nginx l'atteint. db/ = sa base vivante (fiches) : à sauvegarder.
  serveur:
    image: node:22-alpine
    container_name: maverick-center-serveur
    restart: unless-stopped
    command: ["sh", "-c", "until [ -f /site/_serveur/serveur/index.mjs ]; do echo 'Service des personnages : en attente du site (site/_serveur/)'; sleep 30; done; exec node --disable-warning=ExperimentalWarning /site/_serveur/serveur/index.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      MAVERICK_REGLES: /site/donnees/maverick.db
      MAVERICK_DB: /db
    volumes:
      - ./site:/site:ro
      - ./db:/db
