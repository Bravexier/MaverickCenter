# Instance posée par un installateur (à partir de la 1.0). Lancement : docker compose up -d   puis   http://<hôte>:8080 (serveur normal) ou :8081 (test)
# Prérequis : créer .htpasswd (voir README.md), sinon nginx refuse de démarrer.
# Port et nom du conteneur : fichier .env de l'instance (posé par l'installateur : 8080 / maverick-center en production,
# 8081 / maverick-center-test en test). Changez-les dans .env plutôt qu'ici.
# Deux conteneurs : nginx sert le site (site/) et transmet /api/ au service des personnages, qui écrit dans la base vivante (db/).
# Journaux des conteneurs (docker logs) : 5 fichiers de 10 Mo au plus par conteneur, les plus anciens effacés (docs/serveur.md, « Métriques et
# volume ») ; sans ces lignes, le pilote json-file de Docker les garde sans limite.
services:
  maverick-center:
    image: nginx:1.27-alpine
    container_name: ${MAVERICK_CONTENEUR:-maverick-center}
    restart: unless-stopped
    ports:
      - "${MAVERICK_PORT:-8080}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Service des personnages (docs/serveur.md) : son code arrive avec le site (site/_serveur/) et il se relance seul quand une installation
  # en livre une nouvelle version. Aucun port publié : seul nginx l'atteint.
  serveur:
    image: node:22-alpine
    container_name: ${MAVERICK_CONTENEUR:-maverick-center}-serveur
    restart: unless-stopped
    command: ["sh", "-c", "until [ -f /site/_serveur/serveur/index.mjs ]; do echo 'Service des personnages : en attente du site (site/_serveur/)'; sleep 30; done; exec node --disable-warning=ExperimentalWarning /site/_serveur/serveur/index.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      MAVERICK_REGLES: /site/donnees/maverick.db
      MAVERICK_DB: /db
      # Édition des règles depuis le site (docs/serveur.md, « Édition ») : 1 sur le serveur de test seulement (.env de l'instance de test).
      MAVERICK_EDITION: ${MAVERICK_EDITION:-0}
      # Page « Mise à jour » du serveur de test (docs/serveur.md, « Mise à jour ») : adresse publique du site (le workflow GitHub y télécharge le
      # lot figé ; .env, posé par deploy/vps/instances.sh, sinon l'hôte de la requête) et jeton GitHub qui déclenche le workflow (permission
      # Actions seulement), déposé dans secrets/ de l'instance : sans lui, la page dit comment lancer le workflow à la main.
      MAVERICK_ADRESSE_PUBLIQUE: ${MAVERICK_ADRESSE_PUBLIQUE:-}
      MAVERICK_GITHUB_JETON_FICHIER: /secrets/github-actions-token
      # Maintenance pendant une mise à jour (docs/serveur.md, « Maintenance pendant une mise à jour ») : le site de dev y publie l'annonce que les deux
      # serveurs lisent. Dossier de l'hôte : maintenance/ de l'instance par défaut ; le serveur de test prend celui du serveur normal
      # (MAVERICK_DOSSIER_MAINTENANCE dans son .env, posé par deploy/vps/instances.sh), sinon la production n'est jamais mise en maintenance.
      MAVERICK_MAINTENANCE: /maintenance
      # Métriques (docs/serveur.md, « Métriques et volume ») : chaque service écrit SA base <instance>.db dans ce dossier, jamais dans db/ (l'installateur
      # de test, qui remplace le contenu de db/, n'y touche donc pas), et le site de dev y lit aussi celle de la production. Dossier de l'hôte :
      # metriques/ de l'instance par défaut ; sur le VPS, celui du serveur normal pour les deux instances (MAVERICK_DOSSIER_METRIQUES dans chaque .env,
      # posé par deploy/vps/instances.sh : le même nom désigne le dossier de l'hôte dans .env et /metriques ici, dans le conteneur).
      MAVERICK_DOSSIER_METRIQUES: /metriques
      # Nom de l'instance, donc du fichier (prod.db, dev.db) : posé par instances.sh ; vide, le service le déduit de MAVERICK_EDITION (1 : dev).
      MAVERICK_INSTANCE: ${MAVERICK_INSTANCE:-}
      # 1 = requêtes brutes gardées 30 jours (volume : docs/serveur.md) ; 1 = mesures des pages envoyées par le navigateur acceptées en production
      # (le site de dev les accepte toujours). 0 par défaut : à poser dans .env, puis docker compose up -d.
      MAVERICK_METRIQUES_BRUTES: ${MAVERICK_METRIQUES_BRUTES:-0}
      MAVERICK_METRIQUES_PAGES: ${MAVERICK_METRIQUES_PAGES:-0}
    volumes:
      - ./site:/site:ro
      - ./db:/db
      - ./secrets:/secrets:ro
      - ${MAVERICK_DOSSIER_MAINTENANCE:-./maintenance}:/maintenance
      - ${MAVERICK_DOSSIER_METRIQUES:-./metriques}:/metriques
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
