name: Mise à jour des règles

# Page « Mise à jour » du site de dev (client/serveur/notes-de-version.mjs) : « Effectuer la mise à jour », après confirmation, fige un lot (journal
# des modifications du site + champ libre), le sert à https://<site de dev>/api/mise-a-jour/lots/<lot>/ et déclenche ce workflow sur dev.
# Demande du propriétaire : rejouer le lot sur dev, ouvrir une PR avec toutes les modifications de la base, la fusionner seule si elle est sans
# conflit et verte, puis, juste après, livrer dev → master ; et aucune autre table que celles du lot (et de la note de version) ne change.
# Tout est dans client/scripts/mise-a-jour-github.mjs (testé par client/test/mise-a-jour-github.test.mjs) :
#   a. lot téléchargé, empreinte SHA-256 vérifiée ;
#   b. feature/mise-a-jour-regles-<AAAAMMJJ-HHMM> depuis dev, lot rejoué sur data/rows (client/scripts/mise-a-jour-regles.mjs : un conflit arrête
#      tout, rien n'est poussé), liste blanche des fichiers contrôlée deux fois, db:build, db:check et npm test ; essai à blanc : arrêt ici ;
#      puis PR vers dev, attente des checks client, character-service et regles-de-branches VERTS, fusion par commit de fusion (si dev a bougé :
#      PR fermée et lot rejoué sur le nouveau dev, jusqu'à 3 essais) ;
#   c. attente du commit de version que livraison.yml pousse sur dev pour cette PR ;
#   d. PR de livraison dev → master (jamais [V: X+1]), checks verts, fusion par commit de fusion : livraison.yml fait la version X.Y.0, les
#      étiquettes et la publication.
# Relancer le workflow (Re-run) avec le même lot reprend là où il s'est arrêté.
#
# Mise en place (une fois, par le propriétaire) : secret MISE_A_JOUR_TOKEN = jeton personnel fine-grained (administrateur du dépôt), limité à ce
# dépôt, Contents, Pull requests et Workflows en écriture. Le jeton du workflow ne suffit pas : une PR qu'il ouvre ne lance aucune CI, une fusion
# qu'il fait ne lance pas livraison.yml. Variable MISE_A_JOUR_HOTE : seul hôte permis pour l'adresse du lot (défaut dev.maverick-jdr.com, le
# serveur de test de deploy/vps/) : sans cette restriction, quiconque peut déclencher ce workflow (le jeton Actions du serveur de test suffit)
# ferait livrer un lot servi par n'importe quel site, l'empreinte étant fournie par le même appel.
# Le jeton du bot n'est jamais écrit sur le disque (persist-credentials: false) : npm ci, npm test et leurs dépendances ne peuvent pas le lire ;
# le script ne le donne qu'à git push (git fetch : jeton du workflow), par l'environnement de cette seule commande.
on:
  workflow_dispatch:
    inputs:
      lot:
        description: Identifiant du lot figé par la page Mise à jour (uuid)
        type: string
        required: true
      empreinte:
        description: Empreinte SHA-256 du lot (64 caractères hexadécimaux)
        type: string
        required: true
      adresse:
        description: Adresse du lot sur le site de dev (https://…/api/mise-a-jour/lots/<lot>/)
        type: string
        required: true
      essai:
        description: Simulation de mise à jour (applique et contrôle le lot, sans rien pousser ni fusionner)
        type: boolean
        default: false

# Une mise à jour à la fois ; une seconde attend la fin de la première (jamais annulée en route).
concurrency:
  group: mise-a-jour-des-regles
  cancel-in-progress: false

# Le jeton du workflow ne fait que lire (lectures de l'API) ; tout ce qui écrit passe par MISE_A_JOUR_TOKEN.
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  mise-a-jour:
    name: Mise à jour des règles
    # Un workflow_dispatch se lance sur dev seulement (le service le déclenche avec ref: dev).
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Garde-fou — le contenu appartient à un tiers
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::Le dépôt n'est pas privé : mise à jour refusée (le contenu appartient à un tiers)."
            exit 1
          fi

      - name: Garde-fou — jeton du bot (secret MISE_A_JOUR_TOKEN)
        env:
          MISE_A_JOUR_TOKEN: ${{ secrets.MISE_A_JOUR_TOKEN }}
        run: |
          if [ -z "$MISE_A_JOUR_TOKEN" ]; then
            message="Secret MISE_A_JOUR_TOKEN absent : créer un jeton fine-grained (Settings → Developer settings → Fine-grained tokens) limité à ce dépôt, permissions Contents, Pull requests et Workflows en lecture et écriture, par un administrateur du dépôt, puis l'enregistrer dans Settings → Secrets and variables → Actions sous le nom MISE_A_JOUR_TOKEN. Le jeton du workflow ne suffit pas : une PR qu'il ouvre ne lance aucune CI et une fusion qu'il fait ne lance pas livraison.yml."
            echo "::error::$message"
            printf '### Mise à jour des règles\n\n**Échec** : %s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Garde-fou — entrées (lot, empreinte, adresse)
        shell: bash
        env:
          LOT: ${{ inputs.lot }}
          EMPREINTE: ${{ inputs.empreinte }}
          ADRESSE: ${{ inputs.adresse }}
        run: |
          # Les valeurs ne sont jamais recopiées dans le journal avant d'être validées.
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          sha256='^[0-9a-f]{64}$'
          adresse='^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/api/mise-a-jour/lots/[0-9a-f-]{36}/$'
          if ! [[ "$LOT" =~ $uuid ]]; then echo "::error::Entrée « lot » invalide : un uuid est attendu."; exit 1; fi
          if ! [[ "$EMPREINTE" =~ $sha256 ]]; then echo "::error::Entrée « empreinte » invalide : un SHA-256 (64 caractères hexadécimaux minuscules) est attendu."; exit 1; fi
          if ! [[ "$ADRESSE" =~ $adresse ]] || [[ "$ADRESSE" != *"/api/mise-a-jour/lots/$LOT/" ]]; then
            echo "::error::Entrée « adresse » invalide : https://<site de dev>/api/mise-a-jour/lots/$LOT/ est attendue."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          # Jeton du bot pour la récupération seulement : il n'est pas gardé dans .git/config (npm ci et npm test le liraient) ; le script le
          # redonne à git push seul (la branche poussée et la PR doivent déclencher la CI et garde-branches.yml, voir l'en-tête).
          token: ${{ secrets.MISE_A_JOUR_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installer les dépendances
        working-directory: client
        run: npm ci

      - name: Appliquer le lot, PR vers dev, fusion, puis livraison dev → master
        id: appliquer
        env:
          GH_TOKEN: ${{ secrets.MISE_A_JOUR_TOKEN }}
          GITHUB_TOKEN_LECTURE: ${{ github.token }}
          LOT: ${{ inputs.lot }}
          EMPREINTE: ${{ inputs.empreinte }}
          ADRESSE: ${{ inputs.adresse }}
          ESSAI: ${{ inputs.essai }}
          HOTE_ATTENDU: ${{ vars.MISE_A_JOUR_HOTE || 'dev.maverick-jdr.com' }}
        run: node client/scripts/mise-a-jour-github.mjs

      - name: Résumé
        if: always()
        env:
          ETAT: ${{ job.status }}
          ETAPE: ${{ steps.appliquer.outcome }}
          ESSAI: ${{ inputs.essai }}
        run: |
          {
            echo
            if [ -z "$ETAPE" ] || [ "$ETAPE" = skipped ]; then
              echo "**Arrêt avant l'application du lot** (garde-fous, récupération du dépôt ou installation) : voir les étapes ci-dessus. Rien n'a été poussé."
            fi
            if [ "$ESSAI" = true ]; then mode="simulation de mise à jour"; else mode="mise à jour"; fi
            echo "Résultat du workflow ($mode) : $ETAT. La page « Mise à jour » du site de dev affiche cet état."
          } >> "$GITHUB_STEP_SUMMARY"
