name: CI

# Sur chaque PR, et sur master et dev après chaque fusion (les livraisons : livraison.yml ; les règles de branches : garde-branches.yml).
# Et chaque nuit sur dev (la branche par défaut du dépôt : un déclenchement programmé y lit ce fichier, et checkout, `github.ref_name` et le job d'extrait y valent dev) :
# le site de dev change sans que le code bouge (le propriétaire applique une proposition, un lot entre), et les tests qui lisent son contenu peuvent tomber sans
# qu'aucune PR ne le dise (run 44320300043 : six fichiers rouges deux jours après la création des secrets). Seuls l'extrait et le job client y tournent (et
# issue-ci-nocturne, qui en tient l'issue) : les autres jobs ne regardent qu'une PR ou un commit.
on:
  push:
    branches: [master, dev]
  pull_request:
  schedule:
    - cron: '23 3 * * *'

jobs:
  # Le contenu du site de dev pour les tests (lot 10 du chantier de la base de dev, R278 : « Oui, pour les tests seulement » ; docs/flux-git.md, « Contenu
  # lu par les tests »). Un job à part, node: seulement (pas de npm ci) : le runner reçoit tous les secrets d'un job dès son début, et une étape d'un autre
  # job (npm, tests de la PR) ne peut pas lire sa mémoire ; c'est le seul job qui reçoit MAVERICK_EXTRAIT_CLE, la clé de lecture du site de dev. Il
  # n'exécute que client/scripts/db-extrait.mjs de la branche de BASE (dev), tiré par git archive sous $RUNNER_TEMP. L'extrait est chiffré (openssl,
  # AES-256-CBC, PBKDF2 200 000 tours, phrase MAVERICK_CONTENU_CHIFFREMENT passée par l'environnement, jamais en argument) et seul le fichier chiffré part
  # en artefact d'un jour (le dépôt est public) ; le sha256 du clair sort du job (ce n'est pas un secret) pour vérifier le déchiffrement. Repli (le job
  # ne tombe jamais pour cela) : branche visée autre que dev (master : la production a sa propre structure), un des deux secrets absent (PR d'un fork,
  # secrets pas encore créés), site injoignable après les essais ou délai dépassé ; `disponible` vaut false et `raison` dit pourquoi.
  extrait-du-site-de-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      disponible: ${{ steps.extrait.outputs.disponible }}
      raison: ${{ steps.extrait.outputs.raison }}
      date: ${{ steps.extrait.outputs.date }}
      sha256: ${{ steps.extrait.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: extrait
        timeout-minutes: 12
        continue-on-error: true
        env:
          MAVERICK_EXTRAIT_CLE: ${{ secrets.MAVERICK_EXTRAIT_CLE }}
          MAVERICK_CONTENU_CHIFFREMENT: ${{ secrets.MAVERICK_CONTENU_CHIFFREMENT }}
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          repli() { echo "disponible=false" >> "$GITHUB_OUTPUT"; echo "raison=copie du dépôt (data/rows) : $1" >> "$GITHUB_OUTPUT"; echo "Contenu pour les tests : copie du dépôt (data/rows) : $1." | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ "$BASE" != dev ]; then repli "la branche visée est $BASE, pas dev"; exit 0; fi
          if [ -z "$MAVERICK_EXTRAIT_CLE" ]; then repli "secret MAVERICK_EXTRAIT_CLE absent (PR d’un fork, ou secret pas encore créé)"; exit 0; fi
          if [ -z "$MAVERICK_CONTENU_CHIFFREMENT" ]; then repli "secret MAVERICK_CONTENU_CHIFFREMENT absent (PR d’un fork, ou secret pas encore créé)"; exit 0; fi
          base="$RUNNER_TEMP/branche-de-base"
          clair="$RUNNER_TEMP/extrait"
          journal="$RUNNER_TEMP/extrait.log"
          mkdir -p "$base" "$RUNNER_TEMP/chiffre"
          git fetch --no-tags --depth=1 origin "+refs/heads/dev:refs/remotes/origin/extrait-base"
          git archive refs/remotes/origin/extrait-base client/scripts client/serveur client/src/lib client/package.json | tar -x -C "$base"
          for essai in 1 2 3; do
            if (cd "$base/client" && MAVERICK_EXTRAIT_DELAI=150 timeout 180 node --no-warnings scripts/db-extrait.mjs --dossier "$clair") > "$journal" 2>&1; then
              date=$(node -e 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(`${m.fabrique_le} (site ${m.version_du_site ?? "?"}, structure ${m.schema})`)' "$clair/maverick-dev.json")
              sha=$(sha256sum "$clair/maverick-dev.db" | cut -d ' ' -f 1)
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:MAVERICK_CONTENU_CHIFFREMENT -in "$clair/maverick-dev.db" -out "$RUNNER_TEMP/chiffre/maverick-dev.db.enc"
              rm -rf "$clair"
              { echo "disponible=true"; echo "raison="; echo "date=$date"; echo "sha256=$sha"; } >> "$GITHUB_OUTPUT"
              echo "Contenu pour les tests : site de dev, extrait du $date (sha256 $sha), chiffré." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              code=$?
            fi
            [ "$code" = 124 ] && echo "délai de 180 s dépassé" >> "$journal"
            cat "$journal"
            # 401, 403 : la clé est refusée, reprendre n'y changera rien ; sinon (5xx, réseau, délai) : nouvel essai
            if grep -qE '\((401|403)\)' "$journal"; then break; fi
            if [ "$essai" -lt 3 ]; then sleep $((essai * 20)); fi
          done
          repli "site de dev injoignable ($(tail -n 1 "$journal" | cut -c1-160))"
      # seulement le fichier chiffré (le clair a été effacé avant) ; un téléversement raté se lit côté client comme un téléchargement raté : repli
      - if: steps.extrait.outputs.disponible == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: contenu-du-site-de-dev-chiffre
          path: ${{ runner.temp }}/chiffre/maverick-dev.db.enc
          retention-days: 1
          if-no-files-found: error

  client:
    # après l'extrait, quelle que soit son issue (le repli est décidé ici, à l'étape « contenu »)
    needs: extrait-du-site-de-dev
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      # Page « Mise à jour » du site de dev : la base de la production (master) est construite à côté de celle du site (scripts/db-reference.mjs).
      - run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Le contenu que lisent les tests et le build (R278 ; docs/flux-git.md, « Contenu lu par les tests ») : l'extrait chiffré du job précédent, déchiffré
      # sous $RUNNER_TEMP (hors de l'arbre suivi) et vérifié par son sha256 ; ce job ne reçoit que la phrase de chiffrement, à la seule étape « dechiffrement ».
      # L'étape « contenu », sans secret, pose MAVERICK_CONTENU pour tout le job, ou annonce le repli (copie du dépôt, data/rows) : ::warning:: et la raison.
      # Le résumé du job dit toujours quel contenu a été lu. Ces étapes ne sont pas des contrôles (scripts/mise-a-jour-github.mjs#CONTROLES_DE_LA_CI les ignore).
      - id: telechargement
        if: needs.extrait-du-site-de-dev.outputs.disponible == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: contenu-du-site-de-dev-chiffre
          path: ${{ runner.temp }}/contenu-chiffre
      - id: dechiffrement
        if: needs.extrait-du-site-de-dev.outputs.disponible == 'true' && steps.telechargement.outcome == 'success'
        continue-on-error: true
        env:
          MAVERICK_CONTENU_CHIFFREMENT: ${{ secrets.MAVERICK_CONTENU_CHIFFREMENT }}
          ATTENDU: ${{ needs.extrait-du-site-de-dev.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/contenu"
          clair="$RUNNER_TEMP/contenu/maverick-dev.db"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:MAVERICK_CONTENU_CHIFFREMENT -in "$RUNNER_TEMP/contenu-chiffre/maverick-dev.db.enc" -out "$clair"
          lu=$(sha256sum "$clair" | cut -d ' ' -f 1)
          if [ "$lu" != "$ATTENDU" ]; then rm -f "$clair"; echo "sha256 du contenu déchiffré : $lu, attendu : $ATTENDU"; exit 1; fi
      - id: contenu
        env:
          DISPONIBLE: ${{ needs.extrait-du-site-de-dev.outputs.disponible }}
          RAISON: ${{ needs.extrait-du-site-de-dev.outputs.raison }}
          DATE: ${{ needs.extrait-du-site-de-dev.outputs.date }}
          RESULTAT: ${{ needs.extrait-du-site-de-dev.result }}
          TELECHARGEMENT: ${{ steps.telechargement.outcome }}
          DECHIFFREMENT: ${{ steps.dechiffrement.outcome }}
        run: |
          fichier="$RUNNER_TEMP/contenu/maverick-dev.db"
          if [ "$DISPONIBLE" = true ] && [ "$DECHIFFREMENT" = success ] && [ -f "$fichier" ]; then
            echo "MAVERICK_CONTENU=$fichier" >> "$GITHUB_ENV"
            echo "Contenu lu par les tests et le build : site de dev, extrait du $DATE." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [ "$DISPONIBLE" = true ] && [ "$TELECHARGEMENT" != success ]; then raison="copie du dépôt (data/rows) : l’extrait chiffré n’a pas pu être téléchargé"
            elif [ "$DISPONIBLE" = true ]; then raison="copie du dépôt (data/rows) : déchiffrement de l’extrait impossible, ou sha256 différent"
            else raison="${RAISON:-copie du dépôt (data/rows) : le job extrait-du-site-de-dev n’a pas abouti ($RESULTAT)}"; fi
            echo "::warning title=Contenu lu par les tests::$raison"
            echo "Contenu lu par les tests et le build : $raison." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm test
      - run: npm run build
      # Contrôles du site construit (câblage des infobulles et des fiches des pages de magie, gabarits des pages de race et de classe, tableau des métiers, page Équipement (armes, armures et boucliers, ceinture et ses bâtons magiques, accessoires), gabarit commun des tableaux, tableaux et pages des monstres du bestiaire, frise de la chronologie, pages du guide, liens et encart de l’accueil, adresses sans /wiki/ et logo, fiche de personnage et recherche des personnages, rendus des champs modifiables du site de dev, page Debug du site de dev) : se sautent tant que dist/ n’existe pas.
      - run: node --test test/magies-html.test.mjs test/races-html.test.mjs test/classes-html.test.mjs test/metiers-html.test.mjs test/bestiaire-html.test.mjs test/bestiaire-pages-html.test.mjs test/chronologie-html.test.mjs test/armes-html.test.mjs test/armures-html.test.mjs test/composants-html.test.mjs test/accessoires-html.test.mjs test/equipement-html.test.mjs test/ceinture-html.test.mjs test/accueil-html.test.mjs test/tableaux.test.mjs test/guide-html.test.mjs test/site-html.test.mjs test/fiche-html.test.mjs test/edition-rendu.test.mjs test/classe-dons-rendu.test.mjs test/debug-page.test.mjs test/palette-css.test.mjs
      # Ce que fait livraison.yml après la fusion (le site HIDE_EXAMPLES=1, le bandeau de test et l'installateur) :
      # une PR verte ne doit pas casser la publication.
      - run: HIDE_EXAMPLES=1 SITE_MODE=test SITE_TAG=v0.0.0-test npm run build
      - run: grep -q 'class="bandeau-test"' dist/index.html
      - run: sh "$(node ../deploy/installateur/fabriquer.mjs --mode test --site dist --tag v0.0.0-test --version 0.0.0 --sha local --sortie "$RUNNER_TEMP/installateur")" --verifier
      # Le site de production (SITE_MODE=prod, comme l'installateur du serveur normal) : ce qui n'existe que sur le site de dev en est absent (page
      # Debug : ni au menu, ni ses menus, ni leurs scripts ; site-html : sa branche « production »). Sans ce build, ces contrôles ne tourneraient jamais.
      - run: HIDE_EXAMPLES=1 SITE_MODE=prod SITE_TAG=v0.0.0 npm run build
      - run: node --test test/debug-page.test.mjs test/site-html.test.mjs
      # Version portable (liens relatifs, CSS/JS inline) : elle échoue si le script d'une page importe un autre module.
      - run: node ../tools/build-artifact.mjs --out "$RUNNER_TEMP/artifact"

  # L'issue de la CI nocturne (docs/flux-git.md, « Contenu lu par les tests », puce « Chaque nuit ») : sur le déclenchement programmé SEUL, après l'extrait
  # et le client, quelle que soit leur issue. Rouge : ouvre ou réécrit UNE issue au titre fixe (label ci-nocturne : date, lien du run, jobs, étapes et tests
  # en échec lus dans le journal, sans message d'erreur) ; vert : la ferme avec un commentaire ; annulé ou sauté : rien. Aucune correction, aucun push.
  # Seul job qui écrit des issues (moindre privilège) ; il ne reçoit aucun secret du site de dev, ne lance pas npm et n'exécute que le script de dev.
  issue-ci-nocturne:
    needs: [extrait-du-site-de-dev, client]
    if: ${{ github.event_name == 'schedule' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTATS: ${{ toJSON(needs) }}
        run: node --no-warnings client/scripts/ci-nocturne-issue.mjs

  # « Simulation de mise à jour » sur chaque PR (le run 38151792080 du 2026-10-11 a échoué) : ce que fait le job preparer de mise-a-jour.yml —
  # un lot appliqué à data/rows par scripts/mise-a-jour-regles.mjs (production : origin/master), puis ses contrôles (CONTROLES de
  # scripts/mise-a-jour-github.mjs : db:build, db:check et tout le job client ci-dessus), rien ne devant changer ensuite —, avec un lot
  # synthétique : scripts/mise-a-jour-simulation.mjs fait faire de vraies modifications au service du site de dev (guide, métier, sort, dons) et
  # fige le lot comme la page Mise à jour. Une PR qui rendrait la mise à jour impossible (un test qui suppose qu'aucune note de version n'attend
  # sa livraison, un balayage de la base qui lit les traces de la note, une page construite qui suppose les notes d'exemple…) est rouge ici.
  # Quand data/rows porte déjà une note en attente (PR de mise à jour, dev avant la livraison), aucun lot n'est écrit : data/rows est contrôlé tel
  # quel. Installation identique au job client (test/mise-a-jour-simulation.test.mjs épingle le job et ses contrôles).
  simulation-de-mise-a-jour:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      # Page « Mise à jour » du site de dev : la base de la production (master) est construite à côté de celle du site (scripts/db-reference.mjs).
      - run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: node --no-warnings scripts/mise-a-jour-simulation.mjs --lot "$RUNNER_TEMP/lot.json" --reference origin/master
      - run: if [ -f "$RUNNER_TEMP/lot.json" ]; then node --no-warnings scripts/mise-a-jour-regles.mjs --lot "$RUNNER_TEMP/lot.json" --reference origin/master --resume "$RUNNER_TEMP/resume.json"; fi
      # Comme le job preparer : ce qui est contrôlé est ce qui serait commité (indexé avant les contrôles, aucun fichier changé par eux).
      - run: git add --all -- ../data/rows
      - run: npm run db:build
      - run: npm run db:check
      - run: npm test
      - run: npm run build
      - run: node --test test/magies-html.test.mjs test/races-html.test.mjs test/classes-html.test.mjs test/metiers-html.test.mjs test/bestiaire-html.test.mjs test/bestiaire-pages-html.test.mjs test/chronologie-html.test.mjs test/armes-html.test.mjs test/armures-html.test.mjs test/composants-html.test.mjs test/accessoires-html.test.mjs test/equipement-html.test.mjs test/ceinture-html.test.mjs test/accueil-html.test.mjs test/tableaux.test.mjs test/guide-html.test.mjs test/site-html.test.mjs test/fiche-html.test.mjs test/edition-rendu.test.mjs test/classe-dons-rendu.test.mjs test/debug-page.test.mjs test/palette-css.test.mjs
      - run: HIDE_EXAMPLES=1 SITE_MODE=test SITE_TAG=v0.0.0-test npm run build
      - run: grep -q 'class="bandeau-test"' dist/index.html
      - run: sh "$(node ../deploy/installateur/fabriquer.mjs --mode test --site dist --tag v0.0.0-test --version 0.0.0 --sha local --sortie "$RUNNER_TEMP/installateur")" --verifier
      - run: HIDE_EXAMPLES=1 SITE_MODE=prod SITE_TAG=v0.0.0 npm run build
      - run: node --test test/debug-page.test.mjs test/site-html.test.mjs
      - run: node ../tools/build-artifact.mjs --out "$RUNNER_TEMP/artifact"
      - run: git diff --exit-code --stat && test -z "$(git ls-files --others --exclude-standard)"

  # Règles des migrations (lot 7 du chantier « la base du site de dev devient la source de vérité », R274, R275 ; docs/flux-git.md) : une migration fusionnée ne se
  # modifie plus, une migration de structure ne porte aucun texte de règle, un renommage réécrit le journal et l'historique, et les migrations nouvelles passent
  # sur une base remplie (celle de la version dont part la PR, fiches et journal compris) par le code du service. Le bilan va dans le résumé du job.
  # Un job à part, parallèle aux autres : il lui faut l'historique complet (merge-base ; le job client ne récupère que master, à profondeur 1) et aucun paquet
  # npm (node:sqlite seul), donc pas de `npm ci` ; il n'allonge pas la CI. Sur une PR, la base est la branche visée ; sur un push, le commit d'avant (`before`),
  # sinon le premier parent. Vers `master` (PR ou push) : les règles seules (`--sans-essai`) : l'essai reconstruirait la base de `master`, dont `data/rows` a changé hors migrations
  # depuis, et refuserait à tort ; chaque migration a déjà été essayée sur `dev`.
  controle-des-migrations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          EVENEMENT: ${{ github.event_name }}
          BRANCHE_VISEE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          AVANT: ${{ github.event.before }}
        run: |
          essai=
          if [ "$EVENEMENT" = pull_request ]; then
            base="origin/$BRANCHE_VISEE"
            [ "$BRANCHE_VISEE" = master ] && essai=--sans-essai
          elif [ -n "$AVANT" ] && [ "$AVANT" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            base="$AVANT"
            [ "$REF" = refs/heads/master ] && essai=--sans-essai
          else
            base="HEAD^1"
            [ "$REF" = refs/heads/master ] && essai=--sans-essai
          fi
          node --no-warnings scripts/controler-les-migrations.mjs --base "$base" $essai --resume "$GITHUB_STEP_SUMMARY"

  # Contenu écrit à la main (lot 8, garde-fou 12 ; docs/flux-git.md, « Contenu écrit à la main (lot 8) ») : ÉTEINT tant que tools/flux-git/bascule-1.json
  # ne vaut pas « actif: true » sur origin/dev (le job passe alors vert sans rien lire d'autre). Allumé : data/rows/ seulement par le workflow de mise à jour,
  # plus de migration de données, ni contenu ni structure dans un correctif urgent. Pas de npm ci : node: seulement.
  controle-du-contenu-ecrit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          CIBLE: ${{ github.base_ref }}
          SOURCE: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node --no-warnings scripts/controler-le-contenu-ecrit.mjs --cible "$CIBLE" --source "$SOURCE" --sha "$SHA" --resume "$GITHUB_STEP_SUMMARY"

  # Gel des fusions pendant une mise à jour (lot 11, bascule 2 ; docs/flux-git.md, « Gel des fusions pendant une mise à jour ») : ÉTEINT tant que
  # tools/flux-git/bascule-2.json n'a pas « gel_des_fusions: true » sur origin/dev (clé distincte de « actif », absente = éteint) (le job passe alors vert, sans appeler GitHub). Allumé : rouge tant qu'un run du workflow
  # mise-a-jour.yml n'est pas fini, sauf pour les deux fusions que ce workflow fait lui-même (sa branche vers dev, la livraison dev → master) ; geste : relancer ce
  # job quand la mise à jour est finie. Check requis depuis le jour J (R305 : .github/rulesets/, CHECKS_REQUIS). Pas de npm ci : node: seulement, jeton en lecture.
  gel-des-fusions:
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          CIBLE: ${{ github.base_ref }}
          SOURCE: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --no-warnings scripts/gel-des-fusions.mjs --cible "$CIBLE" --source "$SOURCE" --resume "$GITHUB_STEP_SUMMARY"

  character-service:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/character-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
