name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Ce que fait publish-site.yml après la fusion : une PR verte ne doit pas casser la publication.
      - run: HIDE_EXAMPLES=1 npm run build
      # Version portable (liens relatifs, CSS/JS inline) : elle échoue si le script d'une page importe un autre module.
      - run: node ../tools/build-artifact.mjs --out "$RUNNER_TEMP/artifact"

  character-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/character-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
