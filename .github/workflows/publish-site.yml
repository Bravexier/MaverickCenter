name: Publier le site

# Après chaque fusion dans main : tests, construction de la version « à montrer » (sans les pages d'exemple),
# puis publication sur la branche « site ». Le NAS vient chercher cette branche (deploy/update-nas.sh).
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'data/**'   # le site lit la base (explorateur /donnees/) : un changement de data/rows republie
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Garde-fou — le contenu appartient à un tiers
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::Le dépôt n'est pas privé : publication refusée (le contenu appartient à un tiers)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installer et tester
        working-directory: client
        run: |
          npm ci
          npm test

      - name: Construire (sans les pages d'exemple)
        working-directory: client
        run: HIDE_EXAMPLES=1 npm run build

      - name: Publier sur la branche « site » (une seule révision, réécrite à chaque fois)
        working-directory: client/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site construit depuis ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin site:site
