name: Version et livraison

# Règles 4 à 9 du flux Git (docs/flux-git.md), après chaque PR fusionnée dans dev ou master :
#   feature/<nom> → dev     dev : X.Y.Z+1 (master inchangée)
#   dev → master            master et dev : X.Y+1.0, ou X+1.0.0 si la PR porte [V: X+1]
#   hotfix/<nom> → master   master inchangée ; master refusionnée dans dev ; dev : X.Y.Z+1
# Chaque nouvelle version est étiquetée sur le commit qui la porte : VX.Y.Z sur dev, VX.Y sur master (tools/flux-git/regles.mjs).
# Puis la publication (tools/flux-git/regles.mjs#livrableDe) : job « Installateur », un script autonome par fusion (deploy/installateur/), publié
# en « release » — serveur normal (VX.Y, l'étiquette de version de master, puis VX.Y-hotfix.N) depuis master, test (VX.Y.Z, l'étiquette de version
# de dev) depuis dev. Le job « Site » (le site unique sur la branche « site », que suit le paquet du NAS avec deploy/update-site.sh) ne tourne
# plus : livrableDe ne le choisit pour aucune des versions de dev et de master.
# Bascule 2 (lot 11, PR 4 ; tools/flux-git/bascule-2.json lu dans origin/dev, tools/flux-git/bascule-2.mjs) : ÉTEINTE, rien ne change. Allumée, un installateur de TEST ne porte plus de
# pages (deploy/installateur/fabriquer.mjs --kit-seul : le service et le kit ; l'atelier du site de dev fabrique les pages) et le job « Site » est sauté ; la production reste inchangée.
# Enfin (job « Supprimer la branche fusionnée »), la feature/<nom> ou la hotfix/<nom> fusionnée est supprimée sur GitHub, jamais dev.
# Lancement manuel (Actions → Version et livraison → Run workflow) : republie dev ou master sans changer sa version.
on:
  pull_request:
    types: [closed]
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      branche:
        description: Branche à republier (dev = serveur de test ; master = production)
        type: choice
        options: [dev, master]
        default: dev

permissions:
  contents: write

jobs:
  version:
    name: Version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Pas de groupe de concurrence ici : GitHub n'y garde qu'un passage en attente et annulerait les autres (fusions perdues).
    # Des passages simultanés se départagent dans le bot : la poussée atomique de l'un fait échouer l'autre, qui relit et recommence.
    outputs:
      installateurs: ${{ steps.bot.outputs.installateurs }}
      site: ${{ steps.bot.outputs.site }}
      a_supprimer: ${{ steps.bot.outputs.a_supprimer }}
      bascule_2: ${{ steps.bascule.outputs.actif }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0
          # BOT_TOKEN (secret facultatif) : nécessaire dès que master et dev sont protégées contre les poussées directes
          # (voir docs/flux-git.md, « Mise en place »). Sinon, le jeton du workflow.
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Incrémenter les versions, refusionner master dans dev, choisir la publication
        id: bot
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          TITRE: ${{ github.event.pull_request.title }}
          CORPS: ${{ github.event.pull_request.body }}
          BRANCHE: ${{ inputs.branche }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$EVENEMENT" = workflow_dispatch ]; then
            node tools/flux-git/cli.mjs regenerer --branche "$BRANCHE" --pousser
          else
            printf '%s' "$TITRE" > "$RUNNER_TEMP/titre.txt"
            printf '%s' "$CORPS" > "$RUNNER_TEMP/corps.txt"
            node tools/flux-git/cli.mjs appliquer --base "$BASE" --head "$HEAD" --pr "$PR" \
              --texte-fichier "$RUNNER_TEMP/titre.txt" --texte-fichier "$RUNNER_TEMP/corps.txt" --pousser
          fi

      # L'interrupteur de la bascule 2, lu dans origin/dev (jamais dans la branche livrée) ; illisible ou introuvable : « false » et un avertissement, la publication ne se bloque pas.
      - name: Lire l'interrupteur de la bascule 2
        id: bascule
        continue-on-error: true
        run: |
          git fetch --no-tags origin dev || true
          node tools/flux-git/bascule-2.mjs lire --ref origin/dev

  nettoyage:
    name: Supprimer la branche fusionnée
    needs: version
    # Seulement quand le bot a tout fait (une hotfix dont la refusion a échoué reste, pour la reprendre), et pour une branche de ce dépôt.
    if: needs.version.result == 'success' && needs.version.outputs.a_supprimer != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Supprimer feature/<nom> ou hotfix/<nom> (seulement si elle n'a pas bougé depuis la fusion)
        env:
          BRANCHE: ${{ needs.version.outputs.a_supprimer }}
          FUSIONNEE: ${{ github.event.pull_request.head.sha }}
        run: node tools/flux-git/cli.mjs supprimer-fusionnee --branche "$BRANCHE" --sha "$FUSIONNEE" --pousser

  site:
    name: Site (inactif)
    needs: version
    # always() : publier ce que le bot a préparé même s'il signale ensuite un problème (sorties vides sinon : rien ne part).
    # Bascule 2 allumée : la branche « site » n'est plus publiée (un installateur de test ne porte plus de pages).
    if: always() && needs.version.outputs.site != '' && needs.version.outputs.bascule_2 != 'true'
    runs-on: ubuntu-latest
    # Une publication à la fois, la plus récente en dernier (une publication en attente est remplacée par une plus récente).
    concurrency:
      group: publication-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.site }}

      # Page « Mise à jour » du site de dev : la base de la production (master, telle qu'elle est maintenant) à côté de celle du site
      # (scripts/db-reference.mjs ; rien en mode prod).
      - run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installer et tester
        working-directory: client
        run: |
          npm ci
          npm test

      # « Exporter » de la fiche (feuille Google Sheets) : l'identifiant client OAuth de Google, une variable du dépôt (public : pas un secret) ;
      # vide, le bouton reste grisé (deploy/vps/README.md, « Export vers Google Sheets »)
      - name: Construire (sans les pages d'exemple)
        working-directory: client
        env:
          SITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: HIDE_EXAMPLES=1 npm run build

      - name: Publier sur la branche « site » (une seule révision, réécrite à chaque fois)
        working-directory: client/dist
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.version.outputs.site }}
        run: |
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site construit depuis dev ${SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin site:site

  installateur:
    name: Installateur ${{ matrix.livraison.mode }} ${{ matrix.livraison.tag }}
    needs: version
    # always() : un hotfix dont la refusion dans dev échoue garde son installateur de production (le bot l'a déjà étiqueté).
    if: always() && needs.version.outputs.installateurs != '' && needs.version.outputs.installateurs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        livraison: ${{ fromJSON(needs.version.outputs.installateurs) }}
    env:
      MODE: ${{ matrix.livraison.mode }}
      TAG: ${{ matrix.livraison.tag }}
      VERSION: ${{ matrix.livraison.version }}
      SHA: ${{ matrix.livraison.sha }}
      TYPE: ${{ matrix.livraison.type }}
      BASCULE_2: ${{ needs.version.outputs.bascule_2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.livraison.sha }}

      # Page « Mise à jour » du site de dev : la base de la production (master, telle qu'elle est maintenant) à côté de celle du site
      # (scripts/db-reference.mjs ; rien en mode prod).
      - run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installer et tester
        working-directory: client
        run: |
          npm ci
          npm test

      # Bascule 2 : ce que ce passage fait (tools/flux-git/bascule-2.mjs#decisionDeLaLivraison). Éteinte : kit_seul=false, construire_le_site=true (la livraison d'avant).
      - name: Décider (interrupteur de la bascule 2)
        id: decision
        # Un commit d'avant la bascule 2 (un correctif de master, une republication ancienne) n'a pas ce fichier : la livraison est celle d'avant.
        run: |
          if [ -f tools/flux-git/bascule-2.mjs ]; then
            node tools/flux-git/bascule-2.mjs decider --mode "$MODE" --actif "$BASCULE_2"
          else
            printf 'kit_seul=false\nconstruire_le_site=true\n' >> "$GITHUB_OUTPUT"
          fi

      # « Exporter » de la fiche : l'identifiant client OAuth de Google (variable du dépôt ; vide, le bouton reste grisé)
      - name: Construire le site (sans les pages d'exemple ; bandeau TEST en mode test)
        if: steps.decision.outputs.construire_le_site == 'true'
        working-directory: client
        env:
          SITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: HIDE_EXAMPLES=1 SITE_MODE="$MODE" SITE_TAG="$TAG" npm run build

      - name: Fabriquer l'installateur
        id: fabrication
        env:
          KIT_SEUL: ${{ steps.decision.outputs.kit_seul }}
        run: |
          # Serveur de test seulement : le kit de l'atelier (le code et ses node_modules, sans aucun contenu : deploy/installateur/kit.mjs). Les node_modules de « npm ci » sont déjà là.
          kit=""
          if [ "$MODE" = test ]; then kit="--kit ."; fi
          # Bascule 2 allumée (test seulement) : pas de pages, le service et le kit seuls ; sinon le site construit ci-dessus.
          site="--site client/dist"
          if [ "$KIT_SEUL" = true ]; then kit="$kit --kit-seul"; site=""; fi
          fichier=$(node deploy/installateur/fabriquer.mjs --mode "$MODE" $site --tag "$TAG" --version "$VERSION" --sha "$SHA" --sortie "$RUNNER_TEMP/installateurs" $kit)
          sh "$fichier" --verifier
          echo "fichier=$fichier" >> "$GITHUB_OUTPUT"

      - name: Publier la livraison (release GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
          FICHIER: ${{ steps.fabrication.outputs.fichier }}
        run: |
          nom=$(basename "$FICHIER")
          if [ "$MODE" = prod ]; then
            # « latest » (ce que suit mise-a-jour.sh) seulement si ce commit est encore le sommet de master : une construction plus
            # lente ne doit pas faire revenir la production sur une version plus ancienne qu'une autre déjà publiée.
            sommet=$(git ls-remote origin refs/heads/master | cut -f1)
            if [ "$sommet" = "$SHA" ]; then latest=true; else latest=false; fi
            titre="Serveur normal $TAG"; dossier=/srv/maverick-center; options="--latest=$latest"
            usage="Installe ou met à jour le site de production. La base vivante de l'instance (dossier db/) n'est jamais touchée."
          else
            titre="Serveur de test $TAG"; dossier=/srv/maverick-center-test; options="--prerelease --latest=false"
            usage="Installe ou met à jour le serveur de test. Sa base vivante (dossier db/) n'est jamais touchée ; la base de la production n'y est copiée que sur demande (option --copier-base-prod, dans un db/ vide)."
          fi
          {
            echo "Installateur **${MODE}** de Maverick Center : \`${TAG}\` (version ${VERSION}, commit ${SHA:0:7}, ${TYPE})."
            echo
            echo "$usage"
            echo
            echo "Sur le serveur, après avoir copié \`${nom}\` :"
            echo
            echo '```sh'
            echo "sh ${nom} --dossier ${dossier}"
            echo '```'
            echo
            echo "Détails, options et mise à jour automatique : deploy/installateur/README.md. Règles des versions : docs/flux-git.md."
          } > "$RUNNER_TEMP/notes.md"
          # shellcheck disable=SC2086
          gh release create "$TAG" "$FICHIER" --verify-tag --title "$titre" --notes-file "$RUNNER_TEMP/notes.md" $options
